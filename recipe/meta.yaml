{% set deselect_tests = deselect_tests + " --deselect=coremltools/test/blob/test_weights.py" %}
# ModuleNotFoundError: No module named 'peft'
{% set deselect_tests = deselect_tests + " --deselect=coremltools/test/optimize/coreml/test_post_training_quantization.py" %} # [py>=314]
{% set deselect_tests = deselect_tests + " --deselect=coremltools/converters/mil/frontend/torch/test/test_torch_conversion_api.py" %} # [py>=314]
{% set deselect_tests = deselect_tests + " --deselect=coremltools/converters/mil/frontend/torch/test/test_torch_quantization_ops.py" %} # [py>=314]

